services:
  db:
    image: postgres:17-alpine
    container_name: dealsdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealsdb
    ports:
      - "5432:5432"
    volumes:
      - dealsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealsdb-data:
